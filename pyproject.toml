[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleitor"
version = "0.1.0"
description = "CLI para acompanhar os resultados das Eleições 2026 (TSE) em tempo real"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "asn1tools>=0.169",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
eleitor = "eleitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eleitor = ["spec/*.asn1", "render/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
