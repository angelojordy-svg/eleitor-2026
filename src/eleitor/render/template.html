<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleitor 2026 — Resultados (snapshot offline)</title>
<style>
  :root {
    --azul: #0b3a66;
    --azul-claro: #1f6fb2;
    --fundo: #eef2f6;
    --card: #ffffff;
    --texto: #1b2a3a;
    --suave: #5b6b7c;
    --verde: #1e8e3e;
    --barra: #d9e2ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
  }
  header {
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-claro) 100%);
    color: #fff;
    padding: 18px 22px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .meta { margin-top: 6px; font-size: 13px; opacity: .92; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .aviso {
    display: inline-block;
    margin-top: 8px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 12px;
  }
  #btn-atualizar {
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    background: #ffffff;
    color: var(--azul);
    border: 2px solid #ffffff;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
    white-space: nowrap;
  }
  #btn-atualizar:hover { background: #eaf3fb; }
  #btn-atualizar:disabled { opacity: .7; cursor: wait; }
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--azul);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    z-index: 50;
    display: none;
    max-width: 90vw;
  }
  .toast.erro { background: #b0413e; }
  nav.trilha {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 22px;
    background: #fff;
    border-bottom: 1px solid #dde5ee;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav.trilha button, nav.trilha a {
    font: inherit;
    font-size: 13px;
    color: var(--azul-claro);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    text-decoration: none;
  }
  nav.trilha button:hover, nav.trilha a:hover { background: #e8f0f8; }
  nav.trilha .separador { color: var(--suave); }
  nav.trilha .atual { color: var(--texto); font-weight: 600; }
  nav.trilha .voltar {
    background: var(--azul);
    color: #fff !important;
    padding: 6px 14px;
    font-weight: 600;
  }
  nav.trilha .voltar:hover { background: var(--azul-claro); }
  nav.trilha .limpar {
    margin-left: auto;
    border: 1px solid #c7d4e2;
    padding: 6px 14px;
    color: var(--suave) !important;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 22px; }
  h2 { margin: 4px 0 14px; font-size: 20px; color: var(--azul); }
  h3 { margin: 22px 0 10px; font-size: 16px; color: var(--azul); }
  .cards-nivel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin: 18px 0 26px;
  }
  .card-nivel {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    border: 1px solid #dde5ee;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card-nivel:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(11,58,102,.14); }
  .card-nivel .icone { font-size: 30px; }
  .card-nivel h3 { margin: 10px 0 6px; font-size: 17px; color: var(--texto); }
  .card-nivel p { margin: 0; font-size: 13px; color: var(--suave); }
  .busca { position: relative; margin: 8px 0 20px; }
  .busca input {
    width: 100%;
    padding: 13px 16px;
    font: inherit;
    font-size: 15px;
    border: 1px solid #c7d4e2;
    border-radius: 10px;
    background: #fff;
  }
  .busca input:focus { outline: 2px solid var(--azul-claro); border-color: transparent; }
  .resultados-busca {
    position: absolute;
    left: 0; right: 0; top: 52px;
    background: #fff;
    border: 1px solid #dde5ee;
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(11,58,102,.16);
    max-height: 320px;
    overflow: auto;
    z-index: 20;
  }
  .resultados-busca div {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid #f0f4f8;
  }
  .resultados-busca div:last-child { border-bottom: none; }
  .resultados-busca div:hover { background: #e8f0f8; }
  .resultados-busca .uf { color: var(--suave); font-size: 12px; margin-left: 8px; }
  .resultados-busca .aviso-sem { color: #b0413e; font-size: 12px; margin-left: 8px; }
  .painel {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid #dde5ee;
    padding: 18px;
    margin-bottom: 18px;
  }
  .progresso { height: 10px; background: var(--barra); border-radius: 999px; overflow: hidden; margin: 10px 0 6px; }
  .progresso span { display: block; height: 100%; background: linear-gradient(90deg, var(--azul-claro), #35a06b); }
  .linha-info { font-size: 13px; color: var(--suave); }
  .cards-cand {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .filtros {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin: 0 0 14px;
  }
  .filtros input, .filtros select {
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid #c7d4e2;
    border-radius: 8px;
    background: #fff;
    color: var(--texto);
  }
  .filtros input { flex: 1; min-width: 180px; }
  .filtros .contagem { font-size: 12px; color: var(--suave); }
  .cand {
    background: var(--card);
    border: 1px solid #dde5ee;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    position: relative;
  }
  .cand.clicavel { cursor: pointer; transition: box-shadow .12s ease, transform .12s ease; }
  .cand.clicavel:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(11,58,102,.14); }
  .cand .rank {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 12px;
    font-weight: 800;
    color: #b9c8d8;
  }
  .cand .ver-mais { font-size: 12px; color: var(--azul-claro); margin-top: 4px; font-weight: 600; }
  .cand.eleito { border-color: var(--verde); box-shadow: 0 0 0 1px var(--verde) inset; }
  .foto {
    width: 64px; height: 64px;
    border-radius: 10px;
    object-fit: cover;
    background: #dce7f2;
    flex: 0 0 64px;
  }
  .iniciais {
    width: 64px; height: 64px;
    border-radius: 10px;
    background: #dce7f2;
    color: var(--azul);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
    flex: 0 0 64px;
  }
  .cand .info { flex: 1; min-width: 0; }
  .cand .nome { font-weight: 700; font-size: 15px; }
  .cand .partido { color: var(--suave); font-size: 13px; margin: 2px 0 6px; }
  .cand .votos { font-size: 14px; font-weight: 600; }
  .cand .votos small { color: var(--suave); font-weight: 400; margin-left: 6px; }
  .selo {
    display: inline-block;
    background: var(--verde);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  table.tabela {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #dde5ee;
    font-size: 14px;
  }
  table.tabela th, table.tabela td {
    padding: 9px 12px;
    text-align: left;
    border-bottom: 1px solid #eef2f6;
  }
  table.tabela th { background: #f4f8fb; color: var(--azul); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  table.tabela tr:last-child td { border-bottom: none; }
  table.tabela tr.clicavel { cursor: pointer; }
  table.tabela tr.clicavel:hover { background: #f0f6fc; }
  table.tabela td.num, table.tabela th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .abas { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
  .abas button {
    font: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #c7d4e2;
    background: #fff;
    color: var(--azul);
    cursor: pointer;
  }
  .abas button.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
  .grade-uf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .card-uf {
    background: #fff;
    border: 1px solid #dde5ee;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .card-uf:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(11,58,102,.12); }
  .card-uf .sigla { font-size: 18px; font-weight: 800; color: var(--azul); }
  .card-uf .nome { font-size: 12px; color: var(--suave); margin: 2px 0 8px; }
  .card-uf .lider { font-size: 13px; font-weight: 600; }
  .card-uf .pct { font-size: 12px; color: var(--suave); }
  .vazio { color: var(--suave); font-size: 14px; padding: 12px 0; }
  .linha-eleito { background: #eafaf0; }
  .tag-anulado { color: #b0413e; font-size: 11px; border: 1px solid #e6b3b3; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .tag-suplente { color: #8a6100; font-size: 11px; background: #fff7e0; border: 1px solid #ecd39a; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .hemi-wrap { display: flex; justify-content: center; padding: 12px 0 4px; overflow-x: auto; }
  .hemi { max-width: 100%; height: auto; }
  .legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0; }
  .legenda .item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .legenda .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .legenda .sw.dashed { background: none !important; }
  .legenda .obs { color: var(--suave); font-size: 12px; }
  .fonte { max-width: 1180px; margin: 0 auto; padding: 0 22px 26px; color: var(--suave); font-size: 12px; }
  .dica { color: var(--suave); font-size: 13px; margin: 10px 0 0; }
  .mapa-wrap { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(270px, 1fr); gap: 18px; align-items: start; }
  .mapa-wrap > * { min-width: 0; }
  .mapa-caixa { background: var(--card); border: 1px solid #dde5ee; border-radius: 12px; padding: 10px; }
  svg.mapa-br { width: 100%; height: auto; display: block; }
  svg.mapa-br path.uf { stroke: #fff; stroke-width: .8; cursor: pointer; }
  svg.mapa-br path.uf:hover { stroke: var(--azul); stroke-width: 1.8; }
  svg.mapa-br path.uf.em-disputa { stroke: #93a8bf; stroke-dasharray: 4 3; }
  .balao {
    position: fixed;
    z-index: 60;
    display: none;
    max-width: 280px;
    background: #10233a;
    color: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.35;
    box-shadow: 0 10px 26px rgba(0,0,0,.32);
    pointer-events: none;
  }
  .balao.fixo { border: 1px solid #6f8db0; }
  .balao .balao-titulo { font-weight: 800; font-size: 14px; margin-bottom: 4px; }
  .balao .balao-linha { margin-top: 2px; }
  .balao .obs { color: #b9c8d8; }
  .balao .ao-vivo { color: #8fd6a8; font-size: 12px; }
  .balao .balao-dica { margin-top: 6px; color: #ffd98a; font-size: 12px; }
  .balao .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  svg.mapa-br text.rotulo-mapa {
    fill: #0e2136;
    stroke: #fff;
    stroke-width: 2.8px;
    paint-order: stroke;
    stroke-linejoin: round;
    font-weight: 700;
    font-family: inherit;
    pointer-events: none;
  }
  .amostra-hachura {
    width: 26px; height: 16px; border-radius: 3px; display: inline-block;
    background: repeating-linear-gradient(45deg, #7f92a8 0 3px, #e9eef4 3px 8px);
  }
  .amostra-cheio {
    width: 26px; height: 16px; border-radius: 3px; display: inline-block;
    background: linear-gradient(90deg, #b9c6d4, #3f5b7a);
  }
  .controle-rotulo { margin-top: 12px; font-size: 13px; color: var(--suave); }
  .controle-rotulo label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .mapa-lado h3 { margin-top: 0; }
  .chip-forca { display: inline-flex; gap: 2px; margin-right: 8px; vertical-align: middle; }
  .chip-forca i { width: 10px; height: 14px; display: block; border-radius: 2px; }
  .barra-forca { height: 12px; border-radius: 999px; background: linear-gradient(90deg, #e6ecf3, #93a4b8, #4b5c70); margin: 8px 0 4px; }
  .barra-forca-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--suave); }
  .legenda-mapa { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0; }
  .legenda-mapa .linha { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legenda-mapa .linha .n { margin-left: auto; color: var(--suave); font-size: 12px; }
  @media (max-width: 900px) {
    .mapa-wrap { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    main { padding: 14px; }
    .cand { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <h1>Eleitor 2026 — Resultados</h1>
  <div class="meta">
    <span id="meta"></span>
    <button id="btn-atualizar" onclick="atualizarOnline()" title="Busca os dados mais recentes direto do TSE (precisa de internet)">↻ Atualizar online</button>
  </div>
  <span class="aviso">snapshot offline gerado do TSE — use "Atualizar online" ou regenere o arquivo para dados mais novos</span>
</header>
<div class="toast" id="toast"></div>
<div class="balao" id="balao"></div>
<nav class="trilha" id="trilha"></nav>
<main id="app"></main>
<div class="fonte">Fonte: Tribunal Superior Eleitoral (resultados.tse.jus.br) — artefato offline para consulta. Sem vínculo oficial.</div>

<script>
const DADOS = /*__DADOS__*/;

window.onerror = function (msg, fonte, linha, coluna) {
  const alvo = document.getElementById("app");
  if (alvo && !alvo.innerHTML) {
    alvo.innerHTML = '<div class="painel"><h2>Falha ao desenhar esta tela</h2>' +
      '<div class="linha-info">' + String(msg) + ' (linha ' + linha + ')</div>' +
      '<p class="dica">Use "Limpar pesquisa" ou o menu inicial para continuar.</p></div>';
  }
  return false;
};

const $ = (sel) => document.querySelector(sel);
const fmt = (n) => (n || 0).toLocaleString("pt-BR");
const pct = (n) => (n || 0).toFixed(2).replace(".", ",") + "%";
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniciais = (nome) => (nome || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join("").toUpperCase();

function fotoHTML(c) {
  if (c.foto) return `<img class="foto" src="${c.foto}" alt="">`;
  return `<div class="iniciais">${esc(iniciais(c.nome))}</div>`;
}

const ELEICAO_DO_CARGO = { "1": 6257, "3": 6259, "5": 6259, "6": 6259, "7": 6259, "8": 6259, "25": 6261 };

function rotaCandidato(ctx, numero) {
  if (!ctx) return "";
  if (ctx.origem === "brasil") return `#/candidato/brasil/br/${ctx.cargo}/${numero}`;
  if (ctx.origem === "estado") return `#/candidato/estado/${ctx.uf}/${ctx.cargo}/${numero}`;
  return `#/candidato/municipio/${ctx.uf}/${ctx.cargo}/${numero}?m=${ctx.codigo}`;
}

function cardCandidato(c, ctx, posicao) {
  const selo = c.e ? '<span class="selo">ELEITO</span>' : "";
  const rank = posicao ? `<div class="rank">${posicao}º</div>` : "";
  const rota = rotaCandidato(ctx, c.n);
  const classe = `cand ${c.e ? "eleito" : ""} ${rota ? "clicavel" : ""}`;
  const clique = rota ? ` onclick="location.hash='${rota}'"` : "";
  const attrs = ` data-nome="${esc(normalizar(c.nome))}" data-partido="${esc(c.p)}" data-numero="${esc(c.n)}"`;
  return `<div class="${classe}"${clique}${attrs}>
    ${rank}
    ${fotoHTML(c)}
    <div class="info">
      <div class="nome">${esc(c.nome)}${selo}</div>
      <div class="partido">${esc(c.p)} • Nº ${esc(c.n)}</div>
      <div class="votos">${fmt(c.v)} votos <small>${pct(c.pct)}</small></div>
      ${rota ? '<div class="ver-mais">ver página do candidato →</div>' : ""}
    </div>
  </div>`;
}

function barraFiltro(id, partidos) {
  return `<div class="filtros" data-alvo="${id}">
    <input type="search" placeholder="Filtrar por nome ou número..." oninput="filtrarCartoes('${id}')">
    <select onchange="filtrarCartoes('${id}')">
      <option value="">Todos os partidos</option>
      ${partidos.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join("")}
    </select>
    <span class="contagem" id="${id}-cont"></span>
  </div>`;
}

function filtrarCartoes(id) {
  const container = document.getElementById(id);
  if (!container) return;
  const barra = container.previousElementSibling;
  const texto = normalizar(barra.querySelector("input").value.trim());
  const partido = barra.querySelector("select").value;
  let visiveis = 0;
  container.querySelectorAll(".cand").forEach((el) => {
    const nome = el.dataset.nome || "";
    const numero = el.dataset.numero || "";
    const p = el.dataset.partido || "";
    const bateTexto = !texto || nome.includes(texto) || numero === texto;
    const batePartido = !partido || p === partido;
    const ok = bateTexto && batePartido;
    el.style.display = ok ? "" : "none";
    if (ok) visiveis += 1;
  });
  const cont = document.getElementById(id + "-cont");
  if (cont) cont.textContent = visiveis + " candidato(s)";
}

function painelResultado(res, titulo, ctx) {
  const t = res.tot || {};
  const v = res.votos || {};
  const eleitos = (res.cands || []).filter((c) => c.e);
  const idCards = "cards-" + Math.random().toString(36).slice(2, 9);
  const partidos = [...new Set((res.cands || []).map((c) => c.p).filter(Boolean))].sort();
  const notaLocal = ctx && ctx.origem === "brasil"
    ? "Ordenado pelos votos do Brasil"
    : ctx && ctx.origem === "estado"
      ? "Ordenado pelos votos do estado"
      : ctx && ctx.origem === "municipio"
        ? (ctx.zona ? "Ordenado pelos votos desta zona" : "Ordenado pelos votos deste município")
        : "";
  return `<div class="painel">
    <h2>${esc(titulo || res.cargo_nome)}</h2>
    <div class="progresso"><span style="width:${Math.min(100, t.pct || 0)}%"></span></div>
    <div class="linha-info">
      Seções totalizadas: <strong>${fmt(t.st)}</strong> de ${fmt(t.ts)} (${pct(t.pct)}) •
      gerado em ${esc(t.gerado || "—")}
    </div>
    <div class="linha-info">
      Votos válidos: <strong>${fmt(v.validos)}</strong> • Brancos: ${fmt(v.brancos)} •
      Nulos: ${fmt(v.nulos)} • Anulados: ${fmt(v.anulados)}
    </div>
    ${notaLocal ? `<div class="linha-info" style="margin-top:6px"><em>${esc(notaLocal)}</em></div>` : ""}
    ${eleitos.length ? `<div class="linha-info" style="margin-top:8px;color:var(--verde);font-weight:600">
      Eleitos: ${eleitos.map((c) => esc(c.nome) + " (" + esc(c.p) + ")").join(", ")}
    </div>` : ""}
  </div>
  ${barraFiltro(idCards, partidos)}
  <div class="cards-cand" id="${idCards}">${(res.cands || []).map((c, i) => cardCandidato(c, ctx, i + 1)).join("")}</div>`;
}

function painelProporcional(res, titulo) {
  const ranking = res.ranking || [];
  const eleitos = res.eleitos || [];
  const partidos = ordenarPartidos(res.partidos);
  const vagas = res.vagas || 0;
  const t = res.tot || {};

/* ---------- Cores de partido e hemiciclo ---------- */

/* Paleta com matizes espaçados (~40° no núcleo) para o mapa: os tons claros
   e fortes mantêm a mesma matiz, então partidos parecidos (PL x PSD x PSDB,
   PP x PODE, MDB x REPUBLICANOS) ficam distinguíveis em qualquer intensidade.
   Pior par do núcleo: dE(CIEDE2000) = 12,2 — antes 11,3 só no tom base. */
const CORES = {
  "PT": "#f20d33", "PL": "#330df2", "UNIÃO": "#f27f0d", "PP": "#bd0df2",
  "MDB": "#adf20d", "PSD": "#0df2db", "REPUBLICANOS": "#0df259",
  "PSDB": "#0d78f2", "PDT": "#f20d0d", "PSB": "#f2cc0d", "PODE": "#f20d9e",
  "PODEMOS": "#f20d9e", "PSOL": "#f24a0d", "NOVO": "#f2330d",
  "SOLIDARIEDADE": "#f21c0d", "CIDADANIA": "#f20d69", "PC do B": "#f20d4a",
  "PV": "#4af20d", "REDE": "#0df296", "AVANTE": "#f2f20d", "MOBILIZA": "#f20df2",
  "DEMOCRATA": "#0d1cf2", "PSTU": "#f20d80", "PCO": "#f20d1c", "PCB": "#f20dcc",
  "UP": "#780df2", "DC": "#0d3bf2", "MISSÃO": "#0df270", "PRTB": "#f2690d",
  "AGIR": "#870df2", "PSDC": "#0ddbf2", "PMN": "#0df2bd", "PTC": "#f2b50d",
};

function corPartido(sg) { return CORES[sg] || "#64748b"; }

function layoutHemiciclo(total, rows) {
  const rowGap = 11;
  const radii = [];
  for (let i = 0; i < rows; i++) radii.push(26 + i * rowGap);
  const sumR = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map((r) => Math.max(1, Math.round((total * r) / sumR)));
  let diff = total - counts.reduce((a, b) => a + b, 0);
  let idx = counts.length - 1;
  let guard = 0;
  while (diff !== 0 && guard < 10000) {
    if (diff > 0) { counts[idx]++; diff--; }
    else if (counts[idx] > 1) { counts[idx]--; diff++; }
    idx -= 1;
    if (idx < 0) idx = counts.length - 1;
    guard += 1;
  }
  const seats = [];
  for (let i = 0; i < rows; i++) {
    const n = counts[i];
    const r = radii[i];
    for (let j = 0; j < n; j++) {
      const t = n === 1 ? 0.5 : j / (n - 1);
      const ang = Math.PI - t * Math.PI;
      seats.push({ x: r * Math.cos(ang), y: -r * Math.sin(ang), ang: ang });
    }
  }
  return seats;
}

function renderHemiciclo(partidos) {
  const total = partidos.reduce((a, p) => a + p.n, 0);
  if (!total) return `<div class="vazio">Ainda não há cadeiras atribuídas neste recorte (totalização em andamento). A lista dos mais votados aparece abaixo.</div>`;
  const rows = total > 400 ? 14 : total > 120 ? 11 : total > 40 ? 9 : 7;
  const seats = layoutHemiciclo(total, rows);
  seats.sort((a, b) => a.ang - b.ang);
  let k = 0;
  for (const p of partidos) {
    for (let i = 0; i < p.n; i++) {
      seats[k].sg = p.sg;
      seats[k].tipo = p.tipo || "normal";
      k += 1;
    }
  }
  const maxR = Math.max(...seats.map((s) => Math.hypot(s.x, s.y))) + 8;
  const w = Math.round(maxR * 2);
  const h = Math.round(maxR + 8);
  let dots = "";
  for (const s of seats) {
    const cx = (maxR + s.x).toFixed(1);
    const cy = (maxR + s.y).toFixed(1);
    const cor = corPartido(s.sg);
    if (s.tipo === "antigo") {
      dots += `<circle cx="${cx}" cy="${cy}" r="4" fill="none" stroke="${cor}" stroke-width="2" stroke-dasharray="2 2"><title>${esc(s.sg)} (2022)</title></circle>`;
    } else {
      dots += `<circle cx="${cx}" cy="${cy}" r="4" fill="${cor}"><title>${esc(s.sg)}</title></circle>`;
    }
  }
  return `<div class="hemi-wrap"><svg class="hemi" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${dots}</svg></div>`;
}

function legendaCongresso(partidos, temAntigos) {
  const total = partidos.reduce((a, p) => a + p.n, 0);
  const itens = partidos.map((p) => {
    const pct = total ? ((p.n / total) * 100).toFixed(1).replace(".", ",") : "0";
    const dashed = p.tipo === "antigo" ? " dashed" : "";
    return `<span class="item"><span class="sw${dashed}" style="background:${corPartido(p.sg)};border-color:${corPartido(p.sg)}"></span>${esc(p.sg)}: <strong>${p.n}</strong> (${pct}%)</span>`;
  }).join("");
  const obs = temAntigos ? '<span class="obs">— círculos tracejados = eleitos em 2022 (não disputam 2026)</span>' : "";
  return `<div class="legenda">${itens}${obs}</div>`;
}

function tabelaCongresso(partidos) {
  const total = partidos.reduce((a, p) => a + p.n, 0);
  const linhas = partidos.map((p) => {
    const pct = total ? ((p.n / total) * 100).toFixed(2).replace(".", ",") : "0";
    const nota = p.tipo === "antigo" ? ' <span class="obs">(2022)</span>' : "";
    return `<tr><td><span class="sw" style="background:${corPartido(p.sg)};display:inline-block;margin-right:6px"></span>${esc(p.sg)}${nota}</td><td class="num">${p.n}</td><td class="num">${pct}%</td></tr>`;
  }).join("");
  return `<table class="tabela"><thead><tr><th>Partido</th><th class="num">Cadeiras</th><th class="num">%</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

function ordenarPartidos(partidos) {
  return Object.entries(partidos || {})
    .map(([sg, n]) => ({ sg: sg, n: n }))
    .filter((p) => p.n > 0)
    .sort((a, b) => b.n - a.n);
}

const MUN_CACHE = {};

function catalogoInfo(uf, codigo) {
  const item = (DADOS.catalogo || []).find(([u, cod]) => u === uf && cod === codigo);
  if (!item) return null;
  return { uf: item[0], codigo: item[1], nome: item[2], zonas: item[3] || [] };
}

async function carregarMunicipio(uf, codigo) {
  const info = catalogoInfo(uf, codigo);
  if (!info) return null;
  const cargos = {};
  for (const cg of ["1", "3", "5", "6", "7"]) {
    const ele = ELEICAO_DO_CARGO[cg] || 6259;
    try {
      const total = parseResultadoJS(await fetchJson(urlResultado(ele, cg, uf, codigo)));
      cargos[cg] = { cargo_nome: total.cargo_nome, total: total, zonas: [], zonasCarregadas: false };
    } catch (e) {}
  }
  const mun = { uf: uf, codigo: codigo, nome: info.nome, cargos: cargos, secoes_por_zona: {}, aoVivo: true };
  MUN_CACHE[uf + "/" + codigo] = mun;
  return mun;
}

async function carregarZonas(uf, codigo, cg) {
  const mun = MUN_CACHE[uf + "/" + codigo];
  const info = catalogoInfo(uf, codigo);
  if (!mun || !info || !mun.cargos[cg] || mun.cargos[cg].zonasCarregadas) return;
  mun.cargos[cg].zonasCarregadas = true;
  const ele = ELEICAO_DO_CARGO[cg] || 6259;
  const zs = [];
  for (const z of info.zonas) {
    try {
      const zr = parseResultadoJS(await fetchJson(urlResultado(ele, cg, uf, codigo, z)));
      zs.push({ zona: z, ...zr });
    } catch (e) {}
  }
  mun.cargos[cg].zonas = zs;
  render();
}

function municipioAtual(uf, codigo) {
  return acharMunicipio(uf, codigo) || MUN_CACHE[uf + "/" + codigo] || null;
}


/* ---------- Mapa do Brasil ---------- */
/* Regra de cor: matiz = partido do mais votado; intensidade = tamanho da
   maioria (percentual do líder sobre os votos válidos, escala fixa
   30% = tom claro, 70% ou mais = tom cheio). Sem votos = cinza neutro.

   Hachura = estado que vai ao 2º turno (definido no 1º turno).
   Balão + rótulos = votação e apuração (% de seções totalizadas).
   Com internet o número é buscado ao passar o mouse — e para de buscar
   quando a apuração daquela área encerra (100% das seções). */

const MAPA_CARGOS = ["3", "1"];
const MAPA_CINZA = "#e3e8ee";
const MAPA_DISPUTA = "#ccd8e5";
const MAPA_ELEICAO_2T = { "1": 6258, "3": 6260 };

let MAPA_CTX = null;
let MAPA_ALVOS = {};
let MAPA_CACHE = {};
let MAPA_ENCERROU = {};
let MAPA_FIXADO = null;
let MAPA_ATUAL = null;
let MAPA_TIMER = null;
let MAPA_TIPO_PONTEIRO = "mouse";
let MAPA_ROTULOS = false; // mostrar % de apuração nas áreas que já fecharam

function eleicaoDoRecorte(cargo, turno) {
  return turno === "2" ? (MAPA_ELEICAO_2T[cargo] || ELEICAO_DO_CARGO[cargo]) : ELEICAO_DO_CARGO[cargo];
}

function hexParaHsl(hex) {
  const limpo = String(hex || "").replace("#", "");
  if (limpo.length !== 6) return { h: 215, s: 20, l: 60 };
  const r = parseInt(limpo.slice(0, 2), 16) / 255;
  const g = parseInt(limpo.slice(2, 4), 16) / 255;
  const b = parseInt(limpo.slice(4, 6), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  const l = (max + min) / 2;
  if (!d) return { h: 215, s: 0, l: l * 100 };
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return { h: h * 60, s: s * 100, l: l * 100 };
}

function forcaDaMaioria(share) {
  const escala = (DADOS.mapa && DADOS.mapa.escala) || { min: 30, max: 70 };
  const faixa = (escala.max - escala.min) || 40;
  return Math.max(0, Math.min(1, ((share || 0) - escala.min) / faixa));
}

function corDoPartido(partido, share) {
  const t = forcaDaMaioria(share);
  const base = hexParaHsl(corPartido(partido));
  const luz = (68 - 36 * t).toFixed(1);
  const sat = (84 + 12 * t).toFixed(1);
  const matiz = base.s < 6 ? 215 : base.h.toFixed(0);
  return `hsl(${matiz} ${sat}% ${luz}%)`;
}

function nomeDaUf(uf) {
  const est = (DADOS.estados || []).find((e) => e.uf === String(uf).toLowerCase());
  return est ? est.nome : String(uf).toUpperCase();
}

function temVotos(topo) {
  return !!(topo && topo[0] && topo[0][2] > 0);
}

function apuracaoDe(topo) {
  if (!topo || !topo[0]) return null;
  const valor = topo[0][4];
  return typeof valor === "number" ? valor : null;
}

/* Regra de parada: só vale buscar o número de novo enquanto a apuração
   daquela área não encerrou (100% das seções). */
function apuracaoEncerrada(topo) {
  const pst = apuracaoDe(topo);
  return pst !== null && pst >= 100;
}

function statusDaArea(topo, ehSegundoTurno) {
  if (!temVotos(topo)) {
    return topo && topo[0] ? "apuração ainda não começou" : "sem votos por aqui";
  }
  const lider = topo[0];
  const pst = apuracaoDe(topo);
  if (pst !== null && pst >= 100) {
    if (lider[1] > 50) return `resultado definido — eleito com ${pct(lider[1])}`;
    return ehSegundoTurno
      ? `apuração encerrada — vai ao 2º turno (líder com ${pct(lider[1])})`
      : `apuração encerrada — líder com ${pct(lider[1])} (sem maioria)`;
  }
  return pst === null ? "apuração em andamento" : `apuração em andamento (${pst}% das seções)`;
}

function corDoTopo(topo) {
  if (temVotos(topo)) return corDoPartido(topo[0][0], topo[0][1]);
  return topo && topo[0] ? MAPA_DISPUTA : MAPA_CINZA;
}

function ufsEm2Turno(m, cargo) {
  const porTurno = ((m.res || {})[cargo] || {})["2"] || {};
  return Object.keys(porTurno).map((u) => u.toUpperCase());
}

function areaVaiAo2Turno(info) {
  const lista = (MAPA_CTX && MAPA_CTX.em2Turno) || [];
  return lista.indexOf(String(info.uf || "").toUpperCase()) >= 0;
}

let _nomesMunicipios = null;

function nomeDoMunicipio(uf, codigo) {
  if (!_nomesMunicipios) {
    _nomesMunicipios = new Map();
    for (const item of DADOS.catalogo || []) _nomesMunicipios.set(item[0] + item[1], item[2]);
  }
  return _nomesMunicipios.get(String(uf).toLowerCase() + codigo) || codigo;
}

/* ---------- Hachura (vai ao 2º turno) ---------- */

function defsHachura() {
  return `<defs><pattern id="hachura-2t" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255,255,255,.85)" stroke-width="3"></line>
    <line x1="5" y1="0" x2="5" y2="10" stroke="rgba(24,40,62,.38)" stroke-width="1.4"></line>
  </pattern></defs>`;
}

/* ---------- Rótulos de apuração na imagem ---------- */

function resumoDeApuracao(tops) {
  let cem = 0, andamento = 0, sem = 0;
  for (const topo of tops) {
    const pst = apuracaoDe(topo);
    if (pst === null || pst <= 0) sem += 1;
    else if (pst >= 100) cem += 1;
    else andamento += 1;
  }
  return { cem: cem, andamento: andamento, sem: sem };
}

function textoDaApuracao(topo) {
  const pst = apuracaoDe(topo);
  if (pst === null || pst <= 0) return "—";
  return pst + "%";
}

/* Mostra o rótulo quando faz diferença: apuração parcial (em andamento) ou
   quando o usuário pediu para ver todas. */
function mostrarRotulo(topo) {
  const pst = apuracaoDe(topo);
  if (MAPA_ROTULOS) return pst !== null;
  return pst !== null && pst > 0 && pst < 100;
}

function criarRotulo(svg, x, y, tamanho, texto) {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("class", "rotulo-mapa");
  t.setAttribute("x", x.toFixed(1));
  t.setAttribute("y", y.toFixed(1));
  t.setAttribute("font-size", tamanho.toFixed(1));
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("dominant-baseline", "middle");
  t.textContent = texto;
  svg.appendChild(t);
}

function aplicarRotulos() {
  const svg = document.querySelector("svg.mapa-br");
  if (!svg || !MAPA_CTX) return;
  svg.querySelectorAll("text.rotulo-mapa").forEach((no) => no.remove());
  for (const caminho of svg.querySelectorAll("path[data-chave]")) {
    const info = MAPA_ALVOS[caminho.dataset.chave];
    if (!info) continue;
    const topo = MAPA_CACHE[info.chave] || info.topo;
    if (!mostrarRotulo(topo)) continue;
    let cx, cy, largura;
    if (info.rotuloX !== undefined) {
      cx = info.rotuloX;
      cy = info.rotuloY;
      largura = info.rotuloLargura || 60;
    } else {
      const caixa = caminho.getBBox();
      if (caixa.width < 26 || caixa.height < 16) continue; // área pequena: fica só no balão
      cx = caixa.x + caixa.width / 2;
      cy = caixa.y + caixa.height / 2;
      largura = caixa.width;
    }
    criarRotulo(svg, cx, cy, Math.max(8, Math.min(15, largura / 5.5)), textoDaApuracao(topo));
  }
}

function alternarRotulos(ligado) {
  MAPA_ROTULOS = !!ligado;
  aplicarRotulos();
}

function controleDeRotulos(tops) {
  const r = resumoDeApuracao(tops);
  const partes = [];
  if (r.andamento) partes.push(`<strong>${r.andamento}</strong> em andamento`);
  if (r.cem) partes.push(`${r.cem} em 100%`);
  if (r.sem) partes.push(`${r.sem} sem apuração`);
  return `<div class="controle-rotulo">
    <label><input type="checkbox" ${MAPA_ROTULOS ? "checked" : ""} onchange="alternarRotulos(this.checked)"> mostrar o % de apuração em todas as áreas</label>
    <div class="dica" style="margin:4px 0 0">Apuração: ${partes.join(" • ") || "sem dados"}${
      r.andamento ? "" : " — os rótulos aparecem sozinhos onde a contagem está em andamento"
    }</div>
  </div>`;
}

/* ---------- Balão ---------- */

function htmlDoBalao(info, topo) {
  const linhas = [`<div class="balao-titulo">${esc(info.nome)}</div>`];
  if (temVotos(topo)) {
    const [p, share, votos, cand] = topo[0];
    linhas.push(
      `<div class="balao-linha"><span class="sw" style="background:${corPartido(p)}"></span><strong>${esc(cand)}</strong> <span class="obs">(${esc(p)})</span></div>`
    );
    linhas.push(`<div class="balao-linha"><strong>${fmt(votos)}</strong> votos <span class="obs">• ${pct(share)} dos válidos</span></div>`);
    if (topo[1]) {
      linhas.push(`<div class="balao-linha obs">2º: ${esc(topo[1][3])} (${esc(topo[1][0])}) ${pct(topo[1][1])}</div>`);
    }
  } else if (topo && topo[0] && topo[1]) {
    linhas.push(`<div class="balao-linha obs">2º turno: ${esc(topo[0][3])} x ${esc(topo[1][3])}</div>`);
  } else {
    linhas.push(`<div class="balao-linha obs">sem votos apurados por aqui</div>`);
  }
  const pst = apuracaoDe(topo);
  if (pst !== null) {
    linhas.push(`<div class="balao-linha">Apuração: <strong>${pst}%</strong> das seções</div>`);
  }
  linhas.push(`<div class="balao-linha obs">${esc(statusDaArea(topo, areaVaiAo2Turno(info)))}</div>`);
  if (info.buscando) {
    linhas.push(`<div class="balao-linha ao-vivo">buscando o número mais novo no TSE...</div>`);
  } else if (MAPA_CACHE[info.chave]) {
    linhas.push(`<div class="balao-linha ao-vivo">atualizado agora (online)</div>`);
  }
  if (MAPA_TIPO_PONTEIRO === "touch" && MAPA_FIXADO) {
    linhas.push(`<div class="balao-dica">toque de novo para abrir</div>`);
  }
  return linhas.join("");
}

function posicionarBalao(x, y) {
  const balao = $("#balao");
  const largura = balao.offsetWidth || 250;
  const altura = balao.offsetHeight || 130;
  const margem = 16;
  let esq = x + margem;
  let cima = y + margem;
  if (esq + largura > window.innerWidth - 8) esq = Math.max(8, x - largura - margem);
  if (cima + altura > window.innerHeight - 8) cima = Math.max(8, y - altura - margem);
  balao.style.left = esq + "px";
  balao.style.top = cima + "px";
}

function pintarBalao(info, x, y) {
  const balao = $("#balao");
  const topo = MAPA_CACHE[info.chave] || info.topo;
  balao.innerHTML = htmlDoBalao(info, topo);
  balao.style.display = "block";
  balao.classList.toggle("fixo", !!MAPA_FIXADO);
  posicionarBalao(x, y);
}

function mostrarBalao(alvo, x, y, fixar) {
  const chave = alvo && alvo.dataset ? alvo.dataset.chave : null;
  const info = chave ? MAPA_ALVOS[chave] : null;
  if (!info) return;
  MAPA_ATUAL = info;
  MAPA_FIXADO = fixar ? alvo : null;
  pintarBalao(info, x, y);
  const topo = MAPA_CACHE[chave] || info.topo;
  if (!apuracaoEncerrada(topo) && !MAPA_ENCERROU[chave]) agendarBusca(info);
}

function esconderBalao() {
  const balao = $("#balao");
  if (balao) {
    balao.style.display = "none";
    balao.innerHTML = "";
  }
  MAPA_FIXADO = null;
  MAPA_ATUAL = null;
  if (MAPA_TIMER) {
    clearTimeout(MAPA_TIMER);
    MAPA_TIMER = null;
  }
}

/* Espera o ponteiro parar antes de ir à rede (evita rajada ao varrer o mapa). */
function agendarBusca(info) {
  if (MAPA_TIMER) clearTimeout(MAPA_TIMER);
  MAPA_TIMER = setTimeout(() => {
    MAPA_TIMER = null;
    buscarAoVivo(info);
  }, 280);
}

function topoDaResposta(res, quantidade) {
  const cands = (res && res.cands ? res.cands : []).slice(0, quantidade);
  if (!cands.length) return null;
  const validos = (res.votos || {}).validos || 0;
  const pst = Math.round((res.tot || {}).pct || 0);
  return cands.map((c) => [
    c.p || "",
    validos > 0 ? Math.round((c.v * 100 / validos) * 100) / 100 : (c.pct || 0),
    c.v || 0,
    c.nome || "",
    pst,
  ]);
}

async function buscarAoVivo(info) {
  if (info.buscando || MAPA_CACHE[info.chave] || MAPA_ENCERROU[info.chave]) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  info.buscando = true;
  const posicao = MAPA_ATUAL === info && $("#balao") ? { x: 0, y: 0 } : null;
  if (posicao) {
    const r = $("#balao").getBoundingClientRect();
    posicao.x = r.left + 12;
    posicao.y = r.top + 12;
  }
  if (MAPA_ATUAL === info) pintarBalao(info, posicao.x || 40, posicao.y || 40);
  try {
    const url = info.uf
      ? urlResultado(info.eleicao, info.cargo, info.uf, info.cd)
      : urlResultado(info.eleicao, info.cargo);
    const topo = topoDaResposta(parseResultadoJS(await fetchJson(url)), info.quantidade);
    if (!topo) return;
    MAPA_CACHE[info.chave] = topo;
    info.topo = topo;
    info.buscando = false; // já temos o número novo: o balão não mostra mais "buscando"
    if (apuracaoEncerrada(topo)) MAPA_ENCERROU[info.chave] = true;
    const caminho = document.querySelector(`path[data-chave="${info.chave}"]`);
    if (caminho) caminho.setAttribute("fill", corDoTopo(topo));
    if (info.indice !== undefined && MAPA_CTX && MAPA_CTX.resVetor) {
      MAPA_CTX.resVetor[info.indice] = topo;
    }
    if (MAPA_ATUAL === info) pintarBalao(info, posicao.x || 40, posicao.y || 40);
    aplicarRotulos();
  } catch (e) {
    /* sem internet ou arquivo ainda não publicado: mantém o snapshot */
    if (typeof console !== "undefined") console.warn("mapa: não foi possível atualizar ao vivo", e);
  } finally {
    info.buscando = false;
  }
}

function ligarMapa() {
  const svg = document.querySelector("svg.mapa-br");
  if (!svg) return;
  aplicarRotulos();
  svg.addEventListener("pointermove", (ev) => {
    if (MAPA_TIPO_PONTEIRO === "touch") return;
    const alvo = ev.target.closest("path[data-chave]");
    if (!alvo) {
      if (!MAPA_FIXADO) esconderBalao();
      return;
    }
    if (MAPA_FIXADO) return;
    mostrarBalao(alvo, ev.clientX, ev.clientY, false);
  });
  svg.addEventListener("pointerleave", () => {
    if (!MAPA_FIXADO) esconderBalao();
  });
  svg.addEventListener("click", (ev) => {
    const alvo = ev.target.closest("path[data-chave]");
    if (!alvo) return;
    const rota = alvo.dataset.rota;
    if (MAPA_TIPO_PONTEIRO === "touch" && MAPA_FIXADO !== alvo) {
      // primeiro toque só informa; o segundo abre
      ev.preventDefault();
      ev.stopPropagation();
      mostrarBalao(alvo, ev.clientX, ev.clientY, true);
      return;
    }
    if (rota) {
      ev.preventDefault();
      location.hash = rota;
    }
  });
  document.addEventListener("pointerdown", (ev) => {
    MAPA_TIPO_PONTEIRO = ev.pointerType || "mouse";
    if (MAPA_FIXADO && !(ev.target.closest && ev.target.closest("path[data-chave]"))) {
      esconderBalao();
    }
  }, true);
}

/* ---------- Desenho dos mapas ---------- */

function tituloDaArea(nome, topo) {
  if (!temVotos(topo)) {
    if (topo && topo[0] && topo[1]) {
      return `${nome} — sem votos apurados ainda (2º turno: ${topo[0][3]} x ${topo[1][3]})`;
    }
    return `${nome} — sem votos apurados`;
  }
  const [p, share, votos, cand] = topo[0];
  let texto = `${nome} — ${cand} (${p}): ${fmt(votos)} votos, ${pct(share)} dos válidos`;
  if (topo[1]) texto += ` • 2º: ${topo[1][3]} (${topo[1][0]}) ${pct(topo[1][1])}`;
  const pst = apuracaoDe(topo);
  if (pst !== null) texto += ` • apuração ${pst}%`;
  return texto;
}

/* Resolve cargo/turno válidos e monta as abas, para o mapa do Brasil e o
   mapa de um estado usarem o mesmo recorte. */
function recorteDoMapa(params, base) {
  const m = DADOS.mapa || {};
  const cargos = MAPA_CARGOS.filter((cg) => (m.res || {})[cg] || (m.munres || {})[cg]);
  let cargo = params.get("cargo");
  if (!cargo || cargos.indexOf(cargo) < 0) cargo = cargos[0];
  const porTurno = (m.res || {})[cargo] || (m.munres || {})[cargo] || {};
  let turno = params.get("turno");
  if (!turno || !porTurno[turno]) turno = Object.keys(porTurno)[0] || "1";
  const abasCargo = cargos.map((cg) =>
    `<button class="${cg === cargo ? "ativa" : ""}" onclick="location.hash='${base}?cargo=${cg}&turno=${turno}'">${esc(DADOS.cargos[cg] || cg)}</button>`
  ).join("");
  const abasTurno = Object.keys(porTurno).sort().map((t) =>
    `<button class="${t === turno ? "ativa" : ""}" onclick="location.hash='${base}?cargo=${cargo}&turno=${t}'">${t === "2" ? "2º turno" : "1º turno"}</button>`
  ).join("");
  return { cargo: cargo, turno: turno, porTurno: porTurno, abasCargo: abasCargo, abasTurno: abasTurno };
}

function linhaDoNacional(cargo, turno) {
  const nacional = (((DADOS.mapa || {}).brasil || {})[cargo] || {})[turno] || null;
  if (!nacional || !nacional[0]) return "";
  const [pNac, shareNac, , nomeNac] = nacional[0];
  const segundo = nacional[1];
  return `<p class="dica"><strong>Brasil:</strong> ${esc(nomeNac)} (${esc(pNac)})${
    shareNac ? " " + pct(shareNac) + " dos votos válidos" : " — apuração ainda não começou"
  }${segundo && shareNac ? " • 2º: " + esc(segundo[3]) + " (" + esc(segundo[0]) + ") " + pct(segundo[1]) : ""}</p>`;
}

function legendaDeMapa(tops, totalUnidades, rotulo) {
  const contagem = {};
  let comVotos = 0;
  for (const topo of tops) {
    if (!temVotos(topo)) continue;
    comVotos += 1;
    contagem[topo[0][0]] = (contagem[topo[0][0]] || 0) + 1;
  }
  const linhas = Object.entries(contagem)
    .sort((a, b) => b[1] - a[1])
    .map(([p, n]) => {
      const tons = [0, 0.5, 1].map((t) => `<i style="background:${corDoPartido(p, 30 + 40 * t)}"></i>`).join("");
      return `<div class="linha"><span class="chip-forca">${tons}</span>${esc(p)}<span class="n">${n} ${rotulo}</span></div>`;
    })
    .join("") || `<div class="linha" style="color:var(--suave)">Ainda não há votos apurados neste recorte.</div>`;
  const escala = (DADOS.mapa && DADOS.mapa.escala) || { min: 30, max: 70 };
  return `<div class="legenda-mapa">${linhas}</div>
    <div class="barra-forca"></div>
    <div class="barra-forca-label"><span>tom claro: ${escala.min}%</span><span>tom cheio: ${escala.max}%+</span></div>
    <p class="dica">Tom mais forte = maioria maior (% do líder sobre os votos válidos). ${comVotos} de ${totalUnidades} com votos.</p>`;
}

function svgDoMapa(dados, recorte) {
  const m = DADOS.mapa;
  const proj = m.proj || { largura: 1000, altura: 1000 };
  const vb = proj.viewBox || [0, 0, proj.largura, proj.altura];
  const eleicao = eleicaoDoRecorte(recorte.cargo, recorte.turno);
  const lista2t = (MAPA_CTX && MAPA_CTX.em2Turno) || [];
  const usarHachura = lista2t.length > 0 && lista2t.length < Object.keys(m.uf).length;
  const partes = [defsHachura()];
  for (const uf of Object.keys(m.uf).sort()) {
    const geo = m.uf[uf];
    const topo = dados ? dados[uf] : null;
    const chave = "uf/" + uf;
    const vaiAo2t = usarHachura && lista2t.indexOf(uf) >= 0;
    MAPA_ALVOS[chave] = {
      tipo: "uf",
      chave: chave,
      uf: uf.toLowerCase(),
      nome: nomeDaUf(uf),
      topo: topo,
      eleicao: eleicao,
      cargo: recorte.cargo,
      quantidade: 2,
      rotuloX: geo.cx,
      rotuloY: geo.cy,
      rotuloLargura: geo.bb ? geo.bb[2] : 60,
    };
    const classe = !temVotos(topo) && topo && topo[0] ? "uf em-disputa" : "uf";
    partes.push(
      `<path class="${classe}" data-chave="${esc(chave)}" data-rota="#/mapa/${uf.toLowerCase()}" d="${esc(geo.p)}" fill="${corDoTopo(topo)}" role="link" aria-label="${esc(tituloDaArea(nomeDaUf(uf), topo))}"></path>`
    );
    if (vaiAo2t) {
      partes.push(`<path d="${esc(geo.p)}" fill="url(#hachura-2t)" pointer-events="none"></path>`);
    }
  }
  return `<div class="mapa-caixa"><svg class="mapa-br" viewBox="${vb.join(" ")}" role="img" aria-label="Mapa do Brasil por estado">${partes.join("")}</svg></div>`;
}

function svgDosMunicipios(uf, dadosGeo, resVetor, recorte) {
  const eleicao = eleicaoDoRecorte(recorte.cargo, recorte.turno);
  const partes = [];
  const itens = dadosGeo.itens || [];
  for (let i = 0; i < itens.length; i += 1) {
    const codigoIbge = itens[i][0], codigoTse = itens[i][1], path = itens[i][2];
    const topo = resVetor ? resVetor[i] : null;
    const nome = nomeDoMunicipio(uf, codigoTse);
    let chave = null;
    if (codigoTse) {
      chave = "mun/" + uf + "/" + codigoTse;
      MAPA_ALVOS[chave] = {
        tipo: "mun",
        chave: chave,
        uf: uf,
        cd: codigoTse,
        indice: i,
        nome: nome,
        topo: topo,
        eleicao: eleicao,
        cargo: recorte.cargo,
        quantidade: 2,
      };
    }
    const classe = !temVotos(topo) && topo && topo[0] ? "uf em-disputa" : "uf";
    const extras = chave
      ? ` data-chave="${esc(chave)}" data-rota="#/municipio/${uf}/${codigoTse}" role="link"`
      : ` data-ibge="${esc(codigoIbge)}"`;
    partes.push(
      `<path class="${classe}"${extras} d="${esc(path)}" fill="${corDoTopo(topo)}" aria-label="${esc(tituloDaArea(nome, topo))}"></path>`
    );
  }
  return `<div class="mapa-caixa"><svg class="mapa-br" viewBox="${(dadosGeo.vb || [0, 0, 1000, 1000]).join(" ")}" role="img" aria-label="Mapa dos municípios">${partes.join("")}</svg></div>`;
}

function seletorDeEstados(uf) {
  const comMapa = Object.keys((DADOS.mapa || {}).mun || {}).sort();
  if (comMapa.length < 2) return "";
  return `<div class="filtros"><select onchange="if(this.value)location.hash='#/mapa/'+this.value">
    <option value="">Trocar de estado...</option>
    ${comMapa.map((u) => `<option value="${u.toLowerCase()}" ${u === uf.toUpperCase() ? "selected" : ""}>${esc(nomeDaUf(u))}</option>`).join("")}
  </select></div>`;
}

function painelDeCores(tops, totalUnidades, rotulo, extra) {
  return `<div class="painel">
    <h3>Cores</h3>
    <p class="dica" style="margin-top:0">Cada área recebe a cor do <strong>partido mais votado</strong>; a intensidade mostra o tamanho da maioria.</p>
    ${legendaDeMapa(tops, totalUnidades, rotulo)}
    ${extra || ""}
    ${controleDeRotulos(tops)}
  </div>`;
}

function viewMapa(params) {
  const m = DADOS.mapa;
  if (!m || !m.uf) return vazio('Sem mapa neste snapshot. Gere o arquivo novamente sem "--sem-mapa" para habilitar.');

  const recorte = recorteDoMapa(params, "#/mapa");
  const dados = (recorte.porTurno || {})[recorte.turno] || {};
  const tops = Object.keys(dados).map((uf) => dados[uf]);
  const em2Turno = ufsEm2Turno(m, recorte.cargo);
  const distingue2Turno = em2Turno.length > 0 && em2Turno.length < Object.keys(m.uf).length;
  const eleitos = Object.keys(dados).filter((uf) => temVotos(dados[uf]) && dados[uf][0][1] > 50);
  const nota2t = distingue2Turno
    ? `<div class="legenda-mapa"><div class="linha"><span class="amostra-hachura"></span>hachurado = <strong>vai ao 2º turno</strong><span class="n">${em2Turno.length} estado(s)</span></div>
       <div class="linha"><span class="amostra-cheio"></span>cor cheia = eleito no 1º turno<span class="n">${eleitos.length} estado(s)</span></div></div>`
    : "";
  let nota = "";
  if (!tops.some(temVotos)) {
    const emDisputa = Object.keys(dados).filter((uf) => dados[uf] && dados[uf][0] && !temVotos(dados[uf]));
    if (emDisputa.length && !distingue2Turno) {
      nota = `<p class="dica">${emDisputa.length} estado(s) em 2º turno: <strong>${emDisputa.join(", ")}</strong>. A apuração começa no dia da votação.</p>`;
    } else if (recorte.cargo === "3" && recorte.turno === "2") {
      nota = distingue2Turno
        ? `<p class="dica">2º turno para Governador em <strong>${em2Turno.join(", ")}</strong> (hachurado). A apuração começa no dia da votação.</p>`
        : `<p class="dica">Nenhum estado teve 2º turno para Governador.</p>`;
    } else {
      nota = `<p class="dica">Ainda não há votos apurados neste turno — a votação começa no dia da eleição.</p>`;
    }
  }
  MAPA_CTX = { tipo: "uf", cargo: recorte.cargo, turno: recorte.turno, resVetor: null, em2Turno: em2Turno };
  MAPA_ALVOS = {};

  return `<h2>Mapa do Brasil — ${esc(DADOS.cargos[recorte.cargo] || recorte.cargo)}</h2>
    <div class="abas">${recorte.abasCargo}</div>
    <div class="abas">${recorte.abasTurno}</div>
    ${linhaDoNacional(recorte.cargo, recorte.turno)}
    ${nota}
    <div class="mapa-wrap">
      ${svgDoMapa(dados, recorte)}
      <div class="mapa-lado">
        ${painelDeCores(tops, Object.keys(m.uf).length, "estado(s)", nota2t)}
      </div>
    </div>
    <p class="dica">Passe o mouse (ou toque) em um estado para ver <strong>votação e apuração</strong>; clique para abrir o mapa dos municípios. Base: ${(m.proj || {}).nome === "albers" ? "projeção Albers" : "projeção"} • geometria IBGE.</p>`;
}

function viewMapaUf(ufBruto, params) {
  const m = DADOS.mapa;
  const uf = String(ufBruto || "").toLowerCase();
  if (!m || !m.uf) return vazio('Sem mapa neste snapshot. Gere o arquivo novamente sem "--sem-mapa" para habilitar.');
  const dadosGeo = (m.mun || {})[uf.toUpperCase()];
  const voltar = `<p><a href="#/mapa">← mapa do Brasil</a> • <a href="#/estado/${esc(uf)}">ver resultados de ${esc(uf.toUpperCase())} →</a></p>`;
  if (!dadosGeo || !(dadosGeo.itens || []).length) {
    return `<h2>Mapa — ${esc(nomeDaUf(uf))} (${esc(uf.toUpperCase())})</h2>
      <p class="dica">Este estado não tem o mapa por município embutido neste snapshot. Gere o arquivo com <code>--mapa-municipios ${esc(uf)}</code>.</p>${voltar}`;
  }

  const recorte = recorteDoMapa(params, "#/mapa/" + uf);
  const resVetor = (((m.munres || {})[recorte.cargo] || {})[recorte.turno] || {})[uf.toUpperCase()] || [];
  const tops = resVetor.filter(Boolean);
  const total = (dadosGeo.itens || []).length;
  const em2Turno = ufsEm2Turno(m, recorte.cargo);
  const distingue2Turno = em2Turno.length > 0 && em2Turno.length < Object.keys(m.uf).length;
  let nota = "";
  if (!resVetor.some(temVotos)) {
    if (recorte.turno === "2") {
      nota = distingue2Turno && em2Turno.indexOf(uf.toUpperCase()) >= 0
        ? `<p class="dica">Este estado <strong>vai ao 2º turno</strong> para ${esc(DADOS.cargos[recorte.cargo] || recorte.cargo)}; a apuração começa no dia da votação.</p>`
        : `<p class="dica">Nenhum município com votos apurados neste turno ainda.</p>`;
    } else {
      nota = `<p class="dica">Sem votos por município neste recorte.</p>`;
    }
  }
  MAPA_CTX = { tipo: "mun", uf: uf, cargo: recorte.cargo, turno: recorte.turno, resVetor: resVetor, em2Turno: em2Turno };
  MAPA_ALVOS = {};
  const extra = distingue2Turno && em2Turno.indexOf(uf.toUpperCase()) >= 0
    ? `<div class="legenda-mapa"><div class="linha"><span class="amostra-hachura"></span>este estado <strong>vai ao 2º turno</strong></div></div>`
    : "";

  return `<h2>Mapa dos municípios — ${esc(nomeDaUf(uf))} (${esc(uf.toUpperCase())})</h2>
    <div class="abas">${recorte.abasCargo}</div>
    <div class="abas">${recorte.abasTurno}</div>
    ${linhaDoNacional(recorte.cargo, recorte.turno)}
    ${nota}
    <div class="mapa-wrap">
      ${svgDosMunicipios(uf, dadosGeo, resVetor, recorte)}
      <div class="mapa-lado">
        ${painelDeCores(tops, total, "município(s)", extra + seletorDeEstados(uf))}
      </div>
    </div>
    <p class="dica">Passe o mouse (ou toque) em um município para ver <strong>votação e apuração</strong>; toque/clique de novo para abrir zonas e seções (${total} municípios neste mapa). ${voltar}</p>`;
}

function viewMunicipio(uf, codigo, params) {
  let m = municipioAtual(uf, codigo);
  if (!m) {
    const info = catalogoInfo(uf, codigo);
    if (!info) return vazio("Município não encontrado.");
    carregarMunicipio(uf, codigo).then(() => render()).catch(() => mostrarToast("Falha ao buscar o município no TSE.", true));
    return `<h2>${esc(info.nome)} — ${esc(uf.toUpperCase())}</h2>${vazio("Buscando dados ao vivo no TSE... (pode levar alguns segundos)")}`;
  }
  const cargos = m.cargos || {};
  const chaves = Object.keys(cargos);
  if (!chaves.length) return vazio("Sem resultados para este município.");
  let atual = params.get("cargo");
  if (!atual || !cargos[atual]) atual = chaves.includes("3") ? "3" : chaves[0];
  const info = cargos[atual];
  if (m.aoVivo && info && !info.zonasCarregadas) {
    carregarZonas(uf, codigo, atual);
  }
  const zonas = (info.zonas || []).slice().sort((a, b) => a.zona.localeCompare(b.zona));
  const secoes = m.secoes_por_zona || {};

  const tabelaZonas = zonas.length ? `<h3>Zonas eleitorais</h3>
    <table class="tabela"><thead><tr>
      <th>Zona</th><th class="num">Seções</th><th class="num">Votos válidos</th><th>Líder</th><th class="num">Votos líder</th><th></th>
    </tr></thead><tbody>
    ${zonas.map((z) => {
      const lider = z.cands && z.cands[0];
      const temSecoes = (secoes[z.zona] || []).length > 0;
      return `<tr class="clicavel" onclick="location.hash='#/municipio/${uf}/${codigo}/zona/${z.zona}?cargo=${atual}'">
        <td>${esc(z.zona)}</td>
        <td class="num">${fmt(z.tot.st)}/${fmt(z.tot.ts)}</td>
        <td class="num">${fmt(z.votos.validos)}</td>
        <td>${lider ? esc(lider.nome) + " (" + esc(lider.p) + ")" : "—"}</td>
        <td class="num">${lider ? fmt(lider.v) : "—"}</td>
        <td>${temSecoes ? "ver seções →" : ""}</td></tr>`;
    }).join("")}
    </tbody></table>` : "";

  const notaVivo = m.aoVivo
    ? `<p class="dica">Dados buscados <strong>ao vivo</strong> no TSE agora.${info && !info.zonasCarregadas ? " Carregando zonas..." : ""} Votos por seção/urna só estão disponíveis para os municípios embutidos no arquivo.</p>`
    : "";

  return `<h2>${esc(m.nome)} — ${esc(uf.toUpperCase())}</h2>
    ${tabsCargos(cargos, atual, "#/municipio/" + uf + "/" + codigo)}
